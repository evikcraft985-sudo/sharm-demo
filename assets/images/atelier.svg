    <circle cx="482" cy="112" r="11" fill="#a1522e"/><circle cx="482" cy="322" r="11" fill="#a1522e"/><circle cx="482" cy="532" r="11" fill="#a1522e"/>
    <circle cx="400" cy="92" r="11" fill="#a1522e"/><circle cx="400" cy="552" r="11" fill="#a1522e"/>
  </g>
  <!-- stylist chair -->
